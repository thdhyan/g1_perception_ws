[project]
name = "g1_perception_ws"
version = "0.1.0"
description = "G1 humanoid perception, 3D SLAM, PointPillars detection, and whole-body control stack"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "torch==2.3.1+cu121",
    "torchvision==0.18.1+cu121",
    "spconv-cu121>=2.3.6",
    "onnxruntime>=1.18.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "open3d>=0.18.0",
    "pyquaternion>=0.9.9",
    "easydict>=1.10",
    "pyyaml>=6.0",
    "numba>=0.58.0",
    "llvmlite>=0.41.0",
    "tensorboardx>=2.6.0",
    "scikit-image>=0.21.0",
    "shapely>=2.0.0",
    "sharedarray>=3.2.3",
    "tqdm>=4.65.0",
    "trimesh>=4.0.0",
    "rich>=13.0.0",
]

[tool.uv]
extra-index-url = [
    "https://download.pytorch.org/whl/cu121",
]
find-links = [
    "https://download.pytorch.org/whl/cu121",
]
