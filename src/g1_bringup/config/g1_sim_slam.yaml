# SLAM Toolbox parameter file for Unitree G1 in Gazebo Simulation
slam_toolbox:
  ros__parameters:
    # Solver configuration for Ceres
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frame configuration (Gazebo publishes world->warehouse->g1->base_link)
    odom_frame: warehouse
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # Scan matching & mapping parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    scan_buffer_size: 15
    scan_buffer_maximum_scan_distance: 30.0

    # Fine tuning for 360 degree scans
    link_match_minimum_response_fine: 0.1
    distance_decomposition_radius: 3.0
    max_laser_range: 30.0

    # Timing & TF
    minimum_time_interval: 0.1
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    transform_publish_period: 0.05
    map_update_interval: 1.0

    # Mode & Lifecycle
    mode: mapping
    resolution: 0.05
    max_iterations: 500
    enable_interactive_mode: false
    use_sim_time: true
