# ROS2 <-> Gazebo Harmonic bridge configuration for G1 simulation
#
# Sensor plugins in URDF:
#   - mid360_link: gpu_lidar + LivoxHarmonicPlugin (libros2_livox.so)
#       gz topic: /lidar  (PointCloudPacked)
#   - d435_link: rgbd_camera (single sensor -> image + depth + points)
#       gz topics: /camera/image, /camera/depth_image, /camera/points, /camera/camera_info
#
# No livox_ros_driver2 or realsense2_camera needed in sim.

# Simulation clock
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# Robot world pose TF from Gazebo PosePublisher -> ROS /tf
# In Gazebo Harmonic, PosePublisher on model publishes to /world/warehouse/model/g1/pose or /model/g1/pose
- ros_topic_name: /tf
  gz_topic_name: /model/g1/pose
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

- ros_topic_name: /tf
  gz_topic_name: /world/warehouse/model/g1/pose
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

# WBC per-joint position targets: ROS2 -> Gazebo (one Float64 per joint).
# Consumed by the per-joint gz::sim::systems::JointPositionController plugins
# (see g1_description urdf). Legs/waist carry policy output; arms held at 0.
# WBC per-joint position target: left_hip_pitch_joint
- ros_topic_name: /g1/joint/left_hip_pitch_joint
  gz_topic_name: /model/g1/left_hip_pitch_joint
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

