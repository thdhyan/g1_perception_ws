# Pelvis IMU (used by WBC for orientation + angular velocity)
- ros_topic_name: /imu/data
  gz_topic_name: /imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

# Mid-360 onboard IMU (real robot equivalent: /livox/imu, frame=livox_frame)
- ros_topic_name: /livox/imu
  gz_topic_name: /livox/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

# D435i onboard IMU (not consumed by any node yet; parity + future VIO use)
- ros_topic_name: /camera/imu
  gz_topic_name: /camera/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

# G1 joint states.
# NOTE: gz-sim-joint-state-publisher-system publishes on the WORLD-scoped topic
# /world/<world>/model/<model>/joint_state. The short /model/g1/joint_state is
# advertised but stays SILENT — bridging that one leaves the WBC with no joint
# feedback, so it holds a static default pose and the robot falls over.
# World name comes from worlds/g1_warehouse.sdf (<world name="warehouse">).
- ros_topic_name: /joint_states
  gz_topic_name: /world/warehouse/model/g1/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# Mid-360 LiDAR point cloud (gpu_lidar + LivoxHarmonicPlugin)
- ros_topic_name: /livox/mid360/points
  gz_topic_name: /lidar/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS

