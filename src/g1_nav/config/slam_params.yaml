slam_toolbox:
  ros__parameters:
    # Solver configuration for Mid-360 sparse, non-uniform scans
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frame configuration
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # Scan matching parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.05
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 40.0

    # Fine tuning for sparse scans
    link_match_minimum_response_fine: 0.1
    distance_decomposition_radius: 3.5
    max_laser_range: 40.0

    # Timing
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # Mode and logging
    enable_interactive_mode: true
    use_sim_time: false
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0

    # Resolution and optimization
    resolution: 0.05
    max_iterations: 500
    mode: mapping
