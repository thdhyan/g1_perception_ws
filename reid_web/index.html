<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReID — same person? (frame pairs)</title>
<style>
  :root { --bg:#0D1117; --panel:#161B22; --edge:#30363D; --txt:#C8D4EE; --dim:#8B949E; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt);
               font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #app { display:flex; flex-direction:column; height:100%; }
  #panels { flex:1; display:flex; gap:0; min-height:0; }
  .panel { flex:1; display:flex; flex-direction:column; border-right:1px solid var(--edge); min-width:0; }
  .panel:last-child { border-right:none; }
  .phead { padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--edge);
           font-size:13px; display:flex; justify-content:space-between; }
  .pcanvas { flex:1; position:relative; min-height:0; }
  .pcanvas canvas { display:block; }
  .tag { padding:1px 8px; border-radius:10px; font-size:11px; opacity:.9; }
  #A .phead { color:#F9C74F; }  #B .phead { color:#43D9AD; }
  .tagA { background:#3a2f0e; color:#F9C74F; }
  .tagB { background:#0e3a2c; color:#43D9AD; }
  #bar { display:flex; align-items:center; gap:14px; padding:8px 14px;
         background:var(--panel); border-top:1px solid var(--edge); font-size:12.5px; flex-wrap:wrap; }
  #status { flex:1; color:var(--dim); min-width:200px; }
  #status b { color:var(--txt); }
  button { background:#21262D; color:var(--txt); border:1px solid var(--edge);
           border-radius:6px; padding:5px 12px; font: inherit; cursor:pointer; }
  button:hover { border-color:#5A6985; }
  button.yes { color:#F9C74F; }  button.no { color:#FF7B72; }
  kbd { background:#21262D; border:1px solid var(--edge); border-bottom-width:2px;
        border-radius:4px; padding:0 5px; font-size:11px; }
  .hint { color:var(--dim); font-size:11.5px; }
  #done { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
          background:rgba(13,17,23,.85); z-index:10; }
  #done .box { background:var(--panel); border:1px solid var(--edge); border-radius:10px;
               padding:28px 40px; text-align:center; font-size:15px; line-height:1.9; }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js" } }
</script>
</head>
<body>
<div id="app">
  <div id="panels">
    <div class="panel" id="A">
      <div class="phead"><span id="A-title">FRAME A</span><span class="tag tagA" id="A-tag"></span></div>
      <div class="pcanvas" id="A-canvas"></div>
    </div>
    <div class="panel" id="B">
      <div class="phead"><span id="B-title">FRAME B</span><span class="tag tagB" id="B-tag"></span></div>
      <div class="pcanvas" id="B-canvas"></div>
    </div>
  </div>
  <div id="bar">
    <span id="status">Loading…</span>
    <button class="yes" id="b-yes">⟦Y⟧ same</button>
    <button class="no"  id="b-no">⟦N⟧ different</button>
    <button id="b-skip">⟦Space⟧ skip</button>
    <button id="b-prev">⟦←⟧ prev</button>
    <button id="b-quit">⟦Q⟧ finish</button>
    <span class="hint">drag=rotate · right-drag=pan · wheel=zoom · dbl-click=fit</span>
  </div>
</div>
<div id="done"><div class="box" id="done-box"></div></div>
<script type="module" src="/app.js"></script>
</body>
</html>
